PickaxeGoblin:
  Type: HUSK
  Display: '&2Pickaxe Goblin'
  Health: 20
  Damage: 0
  AIGoalsSelectors:
  - 0 clear
  - 1 meleeattack
  - 2 randomstroll
  AITargetSelectors:
  - 0 clear
  - 1 players
  Skills:
  - model{mid=pickaxe_goblin} @self ~onSpawn
  - skill{skill=PickaxeGoblinAttack;sync=true} ~onTimer:1
  - sound{s=entity.vindicator.hurt;v=1;p=2} @self ~onDamaged
  - skill{skill=GoblinDeath} ~onDeath
  Options:
    AlwaysShowName: false
    Collidable: true
    Silent: true
    PreventSunburn: true
    MovementSpeed: 0.3
    MaxCombatDistance: 10
    PreventOtherDrops: true
    Baby: false
