VFX_Phantom_Bow_Arrow_Small:
  Type: block_display
  DisplayOptions:
    Block: AIR
    Billboard: FIXED
  Options:
    Invincible: true
    Collidable: false
  Skills:
  - model{usestatemachine=true;mid=vfx_spectral_arrow_small} @self ~onSpawn
  - brightness{b=15;s=15} @self ~onSpawn
  - BodyRotation{playermode=true;stable=0;rdelay=0;rduration=0} @self ~onSpawn
  - state{s=shoot;p=1} @self ~onSpawn
  - state{s=shoot_end;delay=20;p=2} @self ~onSpawn

