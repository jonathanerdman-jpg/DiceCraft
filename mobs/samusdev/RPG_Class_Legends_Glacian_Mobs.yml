#### VFX ####

VFX_Glacian_Frost_Slash_LR:
  Type: block_display
  DisplayOptions:
    Block: AIR
    Billboard: FIXED
  Options:
    Invincible: true
    Collidable: false
  Skills:
  - model{showshadow=false;usestatemachine=true;mid=vfx_frost_slash_1;lockpitch=true} @self ~onSpawn
  - brightness{b=15;s=15} @self ~onSpawn
  - BodyRotation{playermode=true;stable=0;rdelay=0;rduration=0} @self ~onSpawn
  - state{s=lr;speed=1} @self ~onSpawn
  - setvariable{var=caster.iteration;val=1;type=INTEGER} @self ~onSpawn
  - aura{delay=3;d=6;i=1;
    os=[
    - setvariable{var=caster.iteration;val=1;type=INTEGER}
    ];
    ot=[
    - setvariable{var=caster.iteration;val="<caster.var.iteration>+1"}
    - remapmodel{m=vfx_frost_slash_1;n=vfx_frost_slash_<caster.var.iteration>}
    ];
    oe=[ - remove{delay=1} @self ]} @self ~onSpawn

