#impact
VFX_SAMUS_Impact:
  Type: text_display
  DisplayOptions:
    Text: ""
    BlockLight: 15
    SkyLight: 15
    Scale: 1,1,1
    Billboard: CENTER
    #ShadowStrength: 0
    BackgroundColor: 0,0,0,0
    Translation: 0,0,0
    ViewRange: 5
  Options:
    Invincible: true
    Collidable: false
  Skills:
  - settextdisplay{text="ក";delay=0} @self ~onSpawn
  - settextdisplay{text="ខ";delay=1} @self ~onSpawn
  - settextdisplay{text="គ";delay=2} @self ~onSpawn
  - settextdisplay{text="ឃ";delay=3} @self ~onSpawn
  - settextdisplay{text="ង";delay=4} @self ~onSpawn
  - settextdisplay{text="ច";delay=5} @self ~onSpawn
  - settextdisplay{text="ឆ";delay=6} @self ~onSpawn
  - remove{delay=7} @self ~onSpawn


#ground crack
VFX_SAMUS_Rupture_Small:
  Type: block_display
  DisplayOptions:
    Block: AIR
    Billboard: FIXED
  Options:
    Invincible: true
    Collidable: false
  Skills:
  - model{usestatemachine=true;mid=vfx_earthquake_rupture_1;lockpitch=true} @self ~onSpawn
  - brightness{mid=vfx_earthquake_rupture_1;b=15;s=15} @self ~onSpawn
  - brightness{mid=vfx_earthquake_rupture_1;b=13;s=13;delay=22} @self ~onSpawn
  - brightness{mid=vfx_earthquake_rupture_1;b=11;s=11;delay=26} @self ~onSpawn
  - BodyRotation{playermode=false;stable=0;rdelay=0;rduration=0} @self ~onSpawn
  - state{s=skill2} @self ~onSpawn
  - tint{m=vfx_earthquake_rupture_1;c=F50000;em=false} @self ~onSpawn
  - tint{m=vfx_earthquake_rupture_1;c=BE0000;em=false;delay=22} @self ~onSpawn
  - tint{m=vfx_earthquake_rupture_1;c=8D0000;em=false;delay=24} @self ~onSpawn
  - tint{m=vfx_earthquake_rupture_1;c=570000;em=false;delay=26} @self ~onSpawn
  - tint{m=vfx_earthquake_rupture_1;c=310000;em=false;delay=30} @self ~onSpawn
  - tint{m=vfx_earthquake_rupture_1;c=000000;em=false;delay=32} @self ~onSpawn
  
  - changepart{m=vfx_earthquake_rupture_1;p=body;nm=vfx_earthquake_rupture_2;np=body;delay=44} @self ~onSpawn
  - changepart{m=vfx_earthquake_rupture_1;p=body;nm=vfx_earthquake_rupture_3;np=body;delay=46} @self ~onSpawn
  - changepart{m=vfx_earthquake_rupture_1;p=body;nm=vfx_earthquake_rupture_4;np=body;delay=48} @self ~onSpawn
  - changepart{m=vfx_earthquake_rupture_1;p=body;nm=vfx_earthquake_rupture_5;np=body;delay=50} @self ~onSpawn
  - remove{delay=52} @self ~onSpawn
  
