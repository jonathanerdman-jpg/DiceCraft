VFX_SAMUS_EXPLOSION:
  Type: block_display
  DisplayOptions:
    Block: AIR
    Billboard: FIXED
  Options:
    Invincible: true
    Collidable: false
  Skills:
  - setvariable{var=caster.iteration;val=1;type=INTEGER} @self ~onSpawn
  - aura{d=12;i=1;
    os=[
    - setvariable{var=caster.iteration;val=1;type=INTEGER}
    - model{usestatemachine=true;mid=vfx_explosion_1;lockpitch=true;scale=0.35}
    - BodyRotation{playermode=false;stable=0;rdelay=0;rduration=0}
    - brightness{mid=vfx_explosion_1;b=15;s=15}
    - randomskill{skills=
    [- state{s=skill;speed=1}],
    [- state{s=skill2;speed=1}],
    [- state{s=skill3;speed=1}]}
    ];
    ot=[
    - setvariable{var=caster.iteration;val="<caster.var.iteration>+1"}
    - changepart{m=vfx_explosion_1;nm=vfx_explosion_<caster.var.iteration>;p=body;np=body}
    ];
    oe=[ - remove @self ]} @self ~onSpawn

  - effect:particles{p=smoke;amount=10;hS=0.3;vS=0.3;y=0;size=1;speed=0.05;delay=10} @modelpart{p=body} ~onSpawn
  - effect:particles{p=campfire_cosy_smoke;amount=3;hS=0.5;vS=0.5;y=0;size=1;speed=0.1;delay=10} @modelpart{p=body} ~onSpawn

