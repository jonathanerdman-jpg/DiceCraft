Octo_Tentacle:
  Type: ARMOR_STAND
  AITargetSelectors:
  - players
  Options:
    Marker: true
  Skills:
  - model{mid=octo_tentacle;n=false} @self ~onSpawn
  - state{mid=octo_tentacle;s=spawn} @self ~onSpawn
  - state{mid=octo_tentacle;s=slam;delay=30} @self ~onSpawn
  - totem{md=2;c=1;oH=Tentacle_Attack_DAMAGE;hnp=false;hp=true;hR=2;vR=1;i=1;delay=44} @modelpart{mid=octo_tentacle;pid=tentacle_4} ~onSpawn
  - effect:sound{s=pirate_sounds:samus.tentacle_skill;volume=1;pitch=1;delay=37} @self ~onSpawn
  - remove{delay=70} @self ~onSpawn
  

