# Pirate Swordsman #

Pirate_Swordsman:
  Type: ZOMBIE
  Display: '&4Pirate Swordsman'
  Health: 30
  Damage: 3
  Options:
    MovementSpeed: 0.23
    ShowHealth: false
    PreventRandomEquipment: true
    AlwaysShowName: false
    Persistent: false
    Despawn: true
    PreventOtherDrops: true
    FollowRange: 20
    Silent: true
    KnockbackResistance: 1
    PreventSunburn: true
  Drops:
  - Pirate_Cutlass 1 0.2
  Modules:
    ThreatTable: true
  AIGoalSelectors:
  - 0 clear
  - 1 meleeattack
  - 2 movetowardstarget
  - 3 randomstroll
  AITargetSelectors:
  - 0 clear
  - 1 players
  Skills:
  - model{mid=pirate_swordsman;n=false} @self ~onSpawn
  - skill{s=Changetarget} ~onTimer:160 <99%
  - effect:sound{s=pirate_sounds:samus.pirate_idle;volume=1;pitch=0.95} @self ~onTimer:140 0.7
  - skill{s=Cancelattack;sync=true} ~onAttack
  - skill{s=Pirate_Swordsman_Attack} ~onTimer:10
  
