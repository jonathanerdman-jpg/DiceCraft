# BLOCKBEARD BUCCANEERS - SHIP MINIBOSSES
# v3 - Anti-flight + Doyle engagement fixes
#############################################

vs_pillager_pirate_sniper:
  Type: VINDICATOR
  Display: "&e&lDeadeye Doyle"
  Health: 180
  Damage: 8
  Armor: 10
  Faction: Blockbeard Buccaneers

  Drops:
  - gunpowder 4-8 0.8
  - command{cmd="iagive <killer.name> bhodyssey:pistol_ball 1 silent"} 4-8 0.08
  - command{cmd="iagive <killer.name> bhodyssey:sharpshooter_flintlock 1 silent"} 1 0.08
  - command{cmd="iagive <killer.name> bhodyssey:pirate_treasure_key 1 silent"} 1 0.08
  - command{cmd="iagive <killer.name> bhodyssey:ship_spyglass 1 silent"} 1 0.08
  - command{cmd="iagive <killer.name> bhodyssey:map_fragment_2 1 silent"} 1 0.08
  - command{cmd="iagive <killer.name> bhodyssey:deadeye_eyepatch 1 silent"} 1 1
  - command{cmd="iagive <killer.name> bhodyssey:gold_doubloon 1 silent"} 1 1
  - command{cmd="iagive <killer.name> bhodyssey:dusty_tome 1 silent"} 1 0.05

  # Rare Pieces of Eight
  - command{cmd="iagive <killer.name> bhodyssey:pieceofeight 1-4 silent"} 0.08

  # Card drop
  - command{cmd="rollcard <killer.name>"} @trigger 0.15

  # Optional sigil
  - command{cmd="iagive <killer.name> bhodyssey:cracked_repair_sigil 1 silent"} 0.1

  - bhodyssey_collectibles 1 0.15
  - emerald 1 1
  - exp 1500 1

  DamageModifiers:
  - SUFFOCATION 0

  Options:
    MovementSpeed: 0.15
    PreventOtherDrops: true
    Despawn: false
    Respawn: false
    Persistent: true
    Silent: true
    MaxCombatDistance: 55
    FollowRange: 50
    PreventLeashing: true
    NoDamageTicks: 40
    KnockbackResistance: 1
    PreventRandomEquipment: true
    PreventSuffocation: true
    PreventBlockIn: true

  Modules:
    ThreatTable: true
    ImmunityTable: true

  BossBar:
    Enabled: true
    Title: '&e&lDeadeye Doyle'
    Range: 50
    Color: YELLOW
    Style: SEGMENTED_10

  AIGoalSelectors:
  - clear
  - lookatplayers

  AITargetSelectors:
  - clear
  - players{r=50}
  - attacker
  - OtherFaction

  Skills:
  - model{mid=vs_pillager_pirate3;n=false;save=true} @self ~onSpawnOrLoad

  - addtag{t=can_drown} @self ~onSpawn
  - skill{s=UniversalDrown} @self ~onTimer:40

  - command{c="contagionimmune <caster.uuid>";asConsole=true} @self ~onSpawn

  # Immediately acquire target
  - settarget @NearestPlayer{r=50} @self ~onSpawn
  - skill{s=sniper_combat_start} @self ~onEnterCombat
  - skill{s=voxelspawns_pillager_combat_leave} @self ~onDropCombat

  - effect:sound{s=entity.pillager.hurt;volume=1;pitch=1.2} @self ~onDamaged 0.4
  - skill{s=voxelspawns_pillager_death} @self ~onDeath

  # Base flintlock attack
  # Disabled while Doyle is in water
  - skill{s=voxelspawns_pillager_attack_flintlock_c;sync=true} @self !inblock{b=WATER} ~onAttack

  # Main sniper shot
  # Disabled while Doyle is in water
  - skill{s=sniper_aimed_shot} @target !inblock{b=WATER} ~onTimer:90 0.7

  # Anti-air support
  # Disabled while Doyle is in water
  - skill{s=sniper_anti_air} @self !inblock{b=WATER} ~onTimer:100 0.35

  # Combat flavor
  - skill{s=sniper_call_out} @self ~onTimer:200 0.35

  # Defensive reaction
  - skill{s=sniper_close_quarters} @trigger ~onDamaged 0.35

  # Idle scan
  - skill{s=sniper_idle_scan} @self ~onTimer:240

  # Kill Tracking
  - skill{s=PirateSniperPlayerKill} @trigger ~onDeath
  - skill{s=PirateDeathAnnouncement} @trigger ~onDeath

  # Parrot management
  - summon{type=doyles_parrot;amount=1} @self ~onSpawn
  - signal{s=sic_em} @MIR{r=50;types=doyles_parrot} ~onEnterCombat
  - signal{s=come_back} @MIR{r=50;types=doyles_parrot} ~onDropCombat
  - damage{a=9999;pi=true} @MIR{r=100;types=doyles_parrot} ~onDeath

doyles_parrot:
  Type: PARROT
  Display: "&c&lPolly"
  Health: 40
  Damage: 5
  Options:
    MovementSpeed: 0.45
    FollowRange: 50
    Despawn: false
    Respawn: false
    Persistent: true
    PreventOtherDrops: true
    PreventRandomEquipment: true
  Faction: Blockbeard Buccaneers
  Drops:
  - exp 350 1
  - feather 1-3 0.8
  AIGoalSelectors:
  - clear
  - float
  - meleeattack
  AITargetSelectors:
  - clear
  - players{r=40}
  - OtherFaction
  Skills:
  # Shoulder perch
  - teleport @self @owner ~onTimer:200

  # Arrow dodge — cancels projectile damage entirely
  - skill{s=parrot_arrow_dodge} @self ~onDamaged

  # Doyle signals engagement/return
  - skill{s=parrot_dismount_attack} @self ~onSignal:sic_em
  - skill{s=parrot_return} @self ~onSignal:come_back

  # Combat behavior
  - skill{s=parrot_scratch} @target ~onAttack
  - skill{s=parrot_squawk} @self ~onTimer:60

  # Death
  - skill{s=parrot_death} @self ~onDeath
  
  
