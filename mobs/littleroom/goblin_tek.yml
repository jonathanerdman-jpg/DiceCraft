#### BOMB ####
  
goblin_chopperbomb:
  Type: SILVERFISH
  Display: 'SMOKEFX'
  Faction: GOBLIN
  AITargetSelectors:
  - clear
  AIGoalSelectors:
  - clear
  Options:
    ApplyInvisibility: true
    PreventBlockInfection: true
    Invincible: true
    Silent: true
  Skills:
  - lunge{velocity=.5;velocityY=0} @forward{f=2} ~onSpawn
  - potion{type=SLOW;duration=20;level=1} @self ~onSpawn
  - effect:particles{particle=large_smoke;amount=1;hS=.2;vS=.2;speed=0;size=2} @self ~onTimer:2
  - skill{s=goblin_chopperbomb_detonate} @self ~onTimer:1
  - skill{s=goblin_chopperbomb_detonate} @self ~onDamaged
  - model{mid=goblin_bomb;n=false;i=true} @self ~onSpawn
  - model{mid=goblin_bomb;n=false;i=true} @self ~onLoad
  
  
