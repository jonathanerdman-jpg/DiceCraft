## GOBLINTEK CHOPPER ##
#######################
  
goblin_chopper:
  Type: GHAST
  Display: 'Goblin Chopper'
  Faction: GOBLIN
  Health: 50
  AITargetSelectors:
  - players
  Modules:
    ThreatTable: true
  Options:
    Silent: true
    KnockbackResistance: 1
    FollowRange: 32
    PreventOtherDrops: true
    PreventMobKillDrops: true
    PreventSunburn: true
  Skills:
  - skill{s=goblinchopperIDLEsound} @self ~onTimer:10
  - skill{s=goblinchopperSPAWN} @self ~onSpawn
  - CancelEvent{sync=true} @self ~onShoot
  - skill{s=goblinchopperDASH} @self ~onShoot
  - skill{s=goblinchopperSTEAM} @self ~onTimer:4
  - summon{t=goblin_choppermount} @self ~onDeath
