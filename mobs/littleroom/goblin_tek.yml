####################
## GOBLINTEK MECH ##
####################

#### MOUNT ####

goblin_mechmount:
  Type: RAVAGER
  Display: 'Goblin Mech'
  DamageModifiers:
  - DROWNING 0
  - VOID 0
  - LIGHTNING 0
  - SUICIDE 0
  - STARVATION 0
  - POISON 0
  - MAGIC 0
  - DRAGON_BREATH 0
  - WITHER 0
  - FALLING_BLOCK 0
  - THORNS 0
  - MELTING 0
  - FIRE_TICK 0
  - FIRE 0
  - HOT_FLOOR 0
  - SUFFOCATION 0
  - PROJECTILE -0.001
  - CONTACT 0
  - ENTITY_ATTACK 0
  - ENTITY_EXPLOSION 0
  - BLOCK_EXPLOSION 0
  - FALL 0
  AIGoalSelectors:
  - clear
  AITargetSelectors:
  - clear
  Health: 250
  Options:
    Silent: true
    KnockbackResistance: 1
    PreventOtherDrops: true
    MovementSpeed: 0.1
  Skills:
  - model{mid=goblin_mech;n=false;i=true;drive=true;ride=true;step=1.25;d=false} @self ~onSpawn
  - model{mid=goblin_mech;n=false;i=true;drive=true;ride=true;step=1.25;d=false} @self ~onLoad
  - setspeed{s=0.5} @self ~onSpawn
  - bodyclamp{m=goblin_mech;c=15} @self ~onSpawn
  - throw{velocity=1;velocityY=-3} @EIR{r=2} ~onTimer:1
  - skill{s=goblinmechmountSTEAM} @self ~onTimer:4
  - summon{t=goblin_mechmount} @self ~onDeath
  - skill{s=goblinmechDAMAGEfilter} @trigger ~onDamaged
  - skill{s=goblinmechMOUNTITEMCLEAN} @pir{r=3} ~onTimer:5
  - skill{s=goblinmechmountSPAWN} @self ~onSpawn
  - skill{s=goblinmechmountMELEE} @trigger ~onDamaged
  - skill{s=goblinmechmountFLAMETHROWERsync} @trigger ~onDamaged
  - skill{s=goblinmechmountMOUNT} @self ~onInteract
  - skill{s=goblinmechmountCHARGE} @trigger ~onDamaged
  - skill{s=goblinmechINSERTCANNISTER} @self ~onInteract
  - skill{s=goblin_mechmountDEATH} @self ~onDeath
  - potion{type=DAMAGE_RESISTANCE;duration=15;level=4;p=true;i=true} @ModelDriver ~onTimer:10

##### MOB #####

goblin_mech:
  Type: RAVAGER
  Display: 'Goblin Mech'
  Faction: GOBLIN
  Health: 250
  AITargetSelectors:
  - attackers
  - villagers
  - golems
  - players
  Modules:
    ThreatTable: true
  DamageModifiers:
  - PROJECTILE -0.001
  BossBar:
    Enabled: true
    Title: 'Goblin Mech'
    Range: 20
    Color: RED
    Style: SOLID
  Options:
    Silent: true
    KnockbackResistance: 1
    FollowRange: 32
    PreventOtherDrops: true
    PreventMobKillDrops: true
    Mountable: false
  Skills:
  - skill{s=goblinmechSTEAM} @self ~onTimer:4
  - throw{velocity=1;velocityY=-3} @EIR{r=2} ~onTimer:1
  - randomskill{skills=goblinmechCHARGE,goblinmechFLAMETHROWERsync} @target ~onTimer:10
  - randomskill{skills=goblinmechPUNCH1sync,goblinmechKICKsync,goblinmechGRABsync,goblinmechSLAMsync,goblinmechSWINGsync,goblinmechSTOMPsync;sync=true} @target ~onAttack
  - summon{t=goblin_mechmount} @self ~onDeath
  - summon{t=goblin_engineer_ejected} @ModelPart{mid=goblin_mech;p=cannister} ~onDeath
  - model{mid=goblin_mech;n=false;i=true;drive=true;ride=true;step=1;d=false} @self ~onSpawn
  - model{mid=goblin_mech;n=false;i=true;drive=true;ride=true;step=1;d=false} @self ~onLoad
  - bodyclamp{m=goblin_mech;c=15} @self ~onSpawn
  
  
  
  
  
  
  
