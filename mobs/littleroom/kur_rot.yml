####### MOUNTED ########
  
KUR_ROT:
  Type: RAVAGER  
  Display: 'Kur and Rot'
  BossBar:
    Enabled: true
    Title: 'Kur and Rot'
    Range: 32
    Color: PURPLE
    Style: SOLID
  AITargetSelectors:
  - clear
  - players
  Health: 250
  Damage: 8
  Modules:
    ThreatTable: true
  Options:
    FollowRange: 64
    MovementSpeed: .4
    PreventOtherDrops: true
    Silent: true
    LockPitch: true
    Mountable: false
  Skills:
  - skill{s=kurrot_charge_attack} @self ~onTimer:5
  - skill{s=kurrot_groundslam} @target ~onTimer:20
  - skill{s=kurrot_charge} @self ~onTimer:20
  - skill{s=kurrot_ATTACKsync;sync=true} @self ~onAttack
  - model{mid=kur_rot;d=true;i=true;lpitch=true} @self ~onSpawn
  - model{mid=kur_rot;d=true;i=true;lpitch=true} @self ~onLoad
  - skill{s=kurrot_DEATH} @self ~onDeath
  
