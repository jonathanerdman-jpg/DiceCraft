# Cloudflare Worker: the game and its quest relay, in one deploy.
#
# Build command:  npm run build:pages   (copies the game into dist/)
# Deploy command: npx wrangler deploy
#
# The game's files are served from dist/ as static assets; worker/index.js
# answers only /quest-relay and /quest/CODE (see the comment at its top).
# `name` must match the Worker's name in the Cloudflare dashboard.
name = "dicecraft"
main = "worker/index.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./dist"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "QUESTS"
class_name = "QuestRoom"

# SQLite-backed Durable Objects are what the Workers free plan offers.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["QuestRoom"]
